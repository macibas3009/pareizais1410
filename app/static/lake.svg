<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3b4f"/>
      <stop offset="0.55" stop-color="#2f7d8f"/>
      <stop offset="1" stop-color="#f2c98a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d8fa0"/>
      <stop offset="0.4" stop-color="#1c5f73"/>
      <stop offset="1" stop-color="#0a2f3e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe2b0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe2b0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="0.6" stop-color="#ffd99a"/>
      <stop offset="1" stop-color="#ffd99a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Debesis un saule -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="560" cy="520" r="120" fill="url(#sun)"/>
  <circle cx="560" cy="520" r="42" fill="#fff1cf"/>

  <!-- Tālie pakalni -->
  <path d="M0 520 C120 470 220 500 330 480 S560 450 800 500 V600 H0Z" fill="#5c8f8f" opacity="0.55"/>
  <path d="M0 555 C150 520 260 545 400 530 S650 515 800 545 V600 H0Z" fill="#2d6066" opacity="0.8"/>

  <!-- Mežs krastā -->
  <g fill="#123f45">
    <path d="M0 600 V560 l14-46 14 46 10-30 12 30 14-58 16 58 10-34 12 34 14-50 14 50 V600Z"/>
    <path d="M150 600 V572 l12-40 12 40 10-26 10 26 14-48 14 48 V600Z"/>
    <path d="M620 600 V566 l12-42 12 42 10-28 12 28 16-56 16 56 10-32 12 32 14-46 14 46 10-24 12 24 V600Z"/>
  </g>
  <rect y="592" width="800" height="10" fill="#0f353b"/>

  <!-- Ezers -->
  <rect y="600" width="800" height="400" fill="url(#water)"/>
  <!-- Saules atspulgs -->
  <path d="M520 602 h80 l40 398 h-160Z" fill="url(#glow)" opacity="0.35"/>
  <g stroke="#ffe7bd" stroke-linecap="round" opacity="0.75">
    <line x1="530" y1="625" x2="590" y2="625" stroke-width="3"/>
    <line x1="515" y1="655" x2="605" y2="655" stroke-width="3"/>
    <line x1="540" y1="690" x2="580" y2="690" stroke-width="2.5"/>
    <line x1="500" y1="730" x2="620" y2="730" stroke-width="2.5"/>
    <line x1="525" y1="780" x2="595" y2="780" stroke-width="2"/>
  </g>
  <!-- Viļņi -->
  <g fill="none" stroke="#9fd0d8" stroke-linecap="round" opacity="0.35" stroke-width="2">
    <path d="M60 680 q20-8 40 0 t40 0"/>
    <path d="M240 740 q20-8 40 0 t40 0 t40 0"/>
    <path d="M90 820 q25-10 50 0 t50 0"/>
    <path d="M340 880 q25-10 50 0 t50 0 t50 0"/>
    <path d="M640 840 q20-8 40 0 t40 0"/>
  </g>

  <!-- Niedres priekšplānā -->
  <g stroke="#0b2a2f" stroke-linecap="round" fill="none">
    <path d="M40 1000 Q46 900 36 830" stroke-width="5"/>
    <path d="M62 1000 Q60 910 74 850" stroke-width="4"/>
    <path d="M82 1000 Q90 930 80 880" stroke-width="4"/>
    <path d="M745 1000 Q740 900 752 820" stroke-width="5"/>
    <path d="M765 1000 Q772 920 760 870" stroke-width="4"/>
  </g>
  <g fill="#0b2a2f">
    <ellipse cx="36" cy="842" rx="5" ry="22"/>
    <ellipse cx="74" cy="862" rx="4.5" ry="18"/>
    <ellipse cx="752" cy="832" rx="5" ry="22"/>
  </g>

  <!-- Laiva -->
  <g transform="translate(250 690)">
    <path d="M0 0 h70 l-12 12 h-46z" fill="#0b2a2f"/>
    <line x1="34" y1="0" x2="34" y2="-44" stroke="#0b2a2f" stroke-width="3"/>
    <path d="M36 -42 l26 38 h-26z" fill="#f4efe6" opacity="0.9"/>
  </g>
</svg>
