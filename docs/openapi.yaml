# Ezermalas pieteikumu sistēma · iesniegumu API · līgums v0
# Līgumu maina analītiķis. Katra izmaiņa: atsevišķs komits ar pieteikuma ID.

openapi: 3.0.3
info:
  title: Ezermalas pieteikumu sistēma · iesniegumu API
  version: 0.1.0
  description: |
    Iedzīvotāju iesniegumu pieņemšana un apskate.

    Šis līgums ir analītiķa artefakts un patiesības avots (source of truth).
    Ja programma atbild citādi, nekā rakstīts šeit, tā ir kļūda programmā
    vai līgumā, un par to jālemj.

    > Noteikumi vienkāršoti mācību vajadzībām. Ezermalas novada pašvaldība
    > un OMD reģistrs ir izdomāti. Visi dati ir sintētiski.
servers:
  - url: http://localhost:8000
    description: Lokālais prototips (Codespace)
tags:
  - name: Iesniegumi
    description: Iesnieguma pieņemšana un apskate (R1–R3)
  - name: Sistēma
    description: Tehniskie galapunkti (R4)
  - name: Autentifikācija
    description: Lietotāju reģistrācija un pieslēgšanās (CR-4)

paths:
  /health:
    get:
      tags: [Sistēma]
      operationId: getHealth
      summary: Vai serviss darbojas
      responses:
        '200':
          description: Serviss darbojas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /submissions:
    post:
      tags: [Iesniegumi]
      operationId: createSubmission
      summary: Iesniegt iesniegumu
      description: |
        Pieņem iesniegumu, piešķir ID, statusu `RECEIVED`, saņemšanas laiku
        un atbildes termiņu.

        **Atbildes kanāls (CR-2).** Pēc saņemšanas sistēma pārbauda
        iesniedzēja oficiālo e-adresi OMD reģistrā un nosaka `replyChannel`:
        - OMD `ACTIVE` → `E_ADDRESS`, neatkarīgi no `preferredChannel`.
        - OMD `NOT_ACTIVATED` → `preferredChannel`. Ja izvēlēts `E_ADDRESS`,
          bet e-adrese nav aktivizēta: `EMAIL`, un `reasonCode` norāda iemeslu.
        - OMD 404 (reģistrā nav ieraksta) → tāpat kā `NOT_ACTIVATED`.

        *CR-2 daļa nav pabeigta: skatīt `tracker/CR-2.md` un A1.*
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
            example:
              personalCode: '32000000001'
              fullName: Līga Ozoliņa-Kalniņa
              email: liga@example.com
              preferredChannel: EMAIL
              topic: ROADS
              subject: Bedre Ezera ielā
              body: Pie Ezera ielas 12 ir liela bedre. Lūdzu, salabojiet to.
      responses:
        '201':
          description: Iesniegums pieņemts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionCreated'
        '400':
          $ref: '#/components/responses/ValidationError'

  /submissions/{id}:
    get:
      tags: [Iesniegumi]
      operationId: getSubmission
      summary: Iesniegums pēc ID
      description: Darbinieks atver vienu iesniegumu pēc tā ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Iesnieguma ID
          schema:
            type: string
            example: IES-2026-000123
      responses:
        '200':
          description: Iesniegums atrasts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/register:
    post:
      tags: [Autentifikācija]
      operationId: registerUser
      summary: Reģistrēt lietotāju (CR-4)
      description: |
        Izveido lietotāja kontu. `email` tiek saglabāts mazajiem burtiem un bez
        atstarpēm; viens e-pasts var piederēt tikai vienam kontam.
        Parole tiek glabāta tikai kā jaucējvērtība (scrypt), nekad atklātā tekstā.
        Žurnālā netiek rakstīta parole, e-pasts vai vārds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: janis@example.com
              fullName: Jānis Bērziņš
              password: drosa-parole-123
      responses:
        '201':
          description: Konts izveidots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/AuthValidationError'
        '404':
          $ref: '#/components/responses/AuthNotFound'
        '409':
          description: E-pasts jau ir reģistrēts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: EMAIL_TAKEN
                  message: Email is already registered
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Autentifikācija]
      operationId: loginUser
      summary: Pieslēgties (CR-4)
      description: |
        Pārbauda e-pastu un paroli. Veiksmes gadījumā iestata sesijas sīkdatni
        `session` (HttpOnly, SameSite=Lax, derīga 8 h).
        Nepareiza parole un neesošs e-pasts saņem **vienādu** 401 atbildi,
        lai neatklātu, vai konts eksistē.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: janis@example.com
              password: drosa-parole-123
      responses:
        '200':
          description: Pieslēgšanās izdevās
          headers:
            Set-Cookie:
              description: Sesijas sīkdatne `session` (HttpOnly)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/AuthValidationError'
        '401':
          description: Nepareizs e-pasts vai parole
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password
        '404':
          $ref: '#/components/responses/AuthNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Autentifikācija]
      operationId: logoutUser
      summary: Atslēgties (CR-4)
      description: Padara sesiju nederīgu un dzēš sīkdatni. Bez sesijas arī atbild 204.
      responses:
        '204':
          description: Sesija beigta
        '400':
          $ref: '#/components/responses/AuthValidationError'
        '404':
          $ref: '#/components/responses/AuthNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [Autentifikācija]
      operationId: getCurrentUser
      summary: Pašreizējais lietotājs (CR-4)
      responses:
        '200':
          description: Pieslēgtais lietotājs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/AuthValidationError'
        '401':
          description: Nav derīgas sesijas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Not logged in
        '404':
          $ref: '#/components/responses/AuthNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 0.1.0

    SubmissionCreate:
      type: object
      required:
        - personalCode
        - fullName
        - email
        - preferredChannel
        - topic
        - subject
        - body
      properties:
        personalCode:
          type: string
          description: Iesniedzēja personas kods
          example: '32000000001'
        fullName:
          type: string
          description: Iesniedzēja vārds un uzvārds
          example: Jānis Bērziņš
        email:
          type: string
          format: email
          description: Iesniedzēja e-pasts
          example: janis@example.com
        preferredChannel:
          $ref: '#/components/schemas/PreferredChannel'
        topic:
          $ref: '#/components/schemas/Topic'
        subject:
          type: string
          description: Iesnieguma temats
          example: Bedre Ezera ielā
        body:
          type: string
          description: Iesnieguma teksts
          example: Pie Ezera ielas 12 ir liela bedre. Lūdzu, salabojiet to.

    SubmissionCreated:
      type: object
      required: [id, status, receivedAt, dueDate, replyChannel]
      properties:
        id:
          type: string
          description: Iesnieguma ID
          example: IES-2026-000123
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        receivedAt:
          type: string
          format: date-time
          description: Saņemšanas laiks
          example: '2026-10-01T09:15:00Z'
        dueDate:
          type: string
          description: Atbildes termiņš
          example: '2026-11-02'
        replyChannel:
          $ref: '#/components/schemas/ReplyChannel'
        reasonCode:
          type: string
          nullable: true
          description: |
            Kāpēc `replyChannel` atšķiras no `preferredChannel`.
            `null`, ja kanāls sakrīt. *CR-2: vērtību saraksts nav pabeigts.*
          example: E_ADDRESS_NOT_ACTIVE

    Submission:
      description: Pilns iesnieguma ieraksts
      allOf:
        - $ref: '#/components/schemas/SubmissionCreated'
        - $ref: '#/components/schemas/SubmissionCreate'

    PreferredChannel:
      type: string
      description: Kā iesniedzējs vēlas saņemt atbildi
      enum: [EMAIL, POST, E_ADDRESS]
      example: EMAIL

    ReplyChannel:
      type: string
      description: |
        Kanāls, pa kuru sūtīs atbildi (nosaka sistēma, CR-2).
        *CR-2: vērtību saraksts nav pabeigts.*
      enum: [EMAIL, POST, E_ADDRESS]
      example: E_ADDRESS

    Topic:
      type: string
      description: |
        Iesnieguma tēma:
        `ROADS` Ceļi un ielas · `WASTE` Atkritumi ·
        `PLANNING` Teritorijas plānošana · `OTHER` Cits
      enum: [ROADS, WASTE, PLANNING, OTHER]
      example: ROADS

    SubmissionStatus:
      type: string
      description: Iesnieguma statuss. Jauns iesniegums vienmēr ir `RECEIVED`.
      enum: [RECEIVED, IN_PROGRESS, FORWARDED, ANSWERED, WITHDRAWN]
      example: RECEIVED

    RegisterRequest:
      type: object
      required: [email, fullName, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: janis@example.com
        fullName:
          type: string
          maxLength: 100
          description: Burti (arī latviešu), atstarpes, defise, apostrofs
          example: Jānis Bērziņš
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: janis@example.com
        password:
          type: string
          format: password
          writeOnly: true

    User:
      type: object
      description: Lietotāja konts. Parole atbildē nekad netiek iekļauta.
      required: [id, email, fullName]
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: janis@example.com
        fullName:
          type: string
          example: Jānis Bērziņš

    Error:
      type: object
      description: Vienota kļūdu shēma visiem galapunktiem
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Kļūdas kods, piemēram, `VALIDATION_ERROR` vai `NOT_FOUND`
              example: VALIDATION_ERROR
            message:
              type: string
              description: Cilvēkam lasāms apraksts. Bez personas datiem.
              example: Request validation failed
            details:
              type: array
              description: Katra lauka kļūda atsevišķi (tikai `VALIDATION_ERROR`)
              items:
                type: object
                required: [field, issue]
                properties:
                  field:
                    type: string
                    example: personalCode
                  issue:
                    type: string
                    example: INVALID_FORMAT

  responses:
    ValidationError:
      description: Kļūdains pieprasījums. Iesniegums netiek saglabāts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: personalCode
                  issue: INVALID_FORMAT
    NotFound:
      description: Iesniegums ar šādu ID nav atrasts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Submission not found
    AuthValidationError:
      description: |
        Kļūdains pieprasījums (CR-4). `issue` vērtības:
        `REQUIRED`, `INVALID_FORMAT`, `TOO_SHORT`, `TOO_LONG`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: password
                  issue: TOO_SHORT
    AuthNotFound:
      description: |
        Resurss nav atrasts. CR-4 galapunkti paši 404 neatgriež (neesošs konts
        pieslēdzoties → 401); deklarēts kursa līguma noteikumu dēļ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Resource not found
    InternalError:
      description: Neparedzēta servera kļūda. Atbildē un žurnālā nav personas datu.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: Internal server error
